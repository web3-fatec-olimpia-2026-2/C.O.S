<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Confirmar Exclusão</title>
</head>
<body>
    <div class="alert-box">
        <h2 class="text-danger">Atenção!</h2>
        <p>Você tem certeza que deseja excluir permanentemente a Ordem de Serviço <strong>#{{ ordem.numero_OS }}</strong>?</p>
        <p>Descrição: {{ ordem.descricao }}</p>
        
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sim, Excluir O.S.</button>
            <a href="{% url 'ordens:listar' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>
</html>
