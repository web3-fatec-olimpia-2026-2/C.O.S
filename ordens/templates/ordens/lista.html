<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Ordem de Serviço</title>
</head>
<body>
    <h1>Ordens de Serviço cadastradas</h1>
    <ul>
        {% for ordem in ordens %}
            <li>#OS: {{ ordem.numero_OS }} - {{ ordem.data }} - Descrição do Serviço: {{ ordem.descricao }}</li>
        {% empty %}
            <li>Nenhuma Ordem de Serviço cadastra ainda.</li>
        {% endfor %}
    </ul>
</body>
</html>
