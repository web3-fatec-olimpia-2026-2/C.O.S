
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Ordem de Serviço</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    <h1>Ordens de Serviço</h1>
    <a href="{% url 'ordens:criar' %}">Criar Nova O.S.</a>

    <table border="1" style="margin-top: 20px;">
        <thead>
            <tr>
                <th>Número OS</th>
                <th>Descrição</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for ordem in ordens %}
            
            <tr>
                <td>{{ ordem.numero_OS }}</td>
                <td>{{ ordem.descricao }}</td>
                <td>{{ ordem.status }}</td>
                <td>
                        <a href="{% url 'ordens:editar' ordem.pk %}">Editar</a>
                        
                        
                        <button hx-delete="{% url 'ordens:excluir' ordem.pk %}"
                                hx-target="closest tr"
                                hx-swap="outerHTML"
                                hx-confirm="Tem certeza que deseja apagar a O.S. #{{ ordem.numero_OS }}?">
                            Excluir
                        </button>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4">Nenhuma ordem de serviço cadastrada.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
