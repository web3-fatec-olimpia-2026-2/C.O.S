<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | C.O.S</title>
    {% load static %}
    <!-- Carrega os arquivos estáticos do projeto, como o logotipo e outros recursos visuais -->
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f0f2f5;
            position: relative;
            overflow: hidden;
        }

        /* Brilho de fundo animado: cria um efeito visual suave atrás do card de login */
        .background-glow {
            position: absolute;
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.15) 0%, rgba(59, 130, 246, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            filter: blur(60px);
            z-index: 0;
            pointer-events: none;
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        }

        /* Caixa de login com efeito vidro: dá profundidade, transparência e um visual moderno ao formulário */
        .login-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            padding: 2.5rem 2rem;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            animation: fadeUp 0.6s ease-out;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logo */
        .logo {
            display: block;
            max-width: 100px;
            margin: 0 auto 1rem;
            animation: scaleIn 0.5s ease-out 0.2s both;
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h2 {
            font-size: 26px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        /* Formulário */
        form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .input-box {
            position: relative;
            width: 100%;
        }

        .input-box input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #d1d5db;
            outline: none;
            color: #1f2937;
            font-size: 15px;
            border-radius: 10px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            background: white;
        }

        .input-box label {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
            font-size: 14px;
            pointer-events: none;
            transition: all 0.2s ease;
            background: transparent;
            padding: 0 4px;
        }

        /* Animação do rótulo flutuante */
        .input-box input:focus + label,
        .input-box input:not(:placeholder-shown) + label {
            top: 0;
            transform: translateY(-50%);
            font-size: 12px;
            color: #2563eb;
            background: white;
            font-weight: 500;
        }

        .input-box input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
            background: white;
        }

        /* Botão com animação */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 100%);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: translateY(0);
            box-shadow: 0 2px 10px rgba(37, 99, 235, 0.2);
        }

        /* Mensagem de erro */
        .erro {
            background: #fee2e2;
            color: #dc2626;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border-radius: 8px;
            text-align: center;
            animation: shake 0.4s ease-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* Responsivo */
        @media (max-width: 480px) {
            .login-card {
                margin: 16px;
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- Brilho animado no fundo -->
    <div class="background-glow"></div>

    <!-- Caixa de login -->
    <div class="login-card">
        <img src="{% static 'logo.png' %}" alt="Logo C.O.S" class="logo">
        
        <div class="login-header">
            <h2>Entrar</h2>
        </div>

        {% if form.errors %}
            <div class="erro">Usuário ou senha inválidos</div>
        {% endif %}

        <!-- Início do formulário de autenticação: os dados serão enviados via POST para validação do backend -->
        <form method="POST">
            {% csrf_token %}
            <!-- Token CSRF para proteger o formulário contra ataques de falsificação de requisição -->
            
            <div class="input-box">
                <input type="text" name="username" id="id_username" placeholder=" " required autofocus>
                <label for="id_username">Usuário</label>
            </div>

            <div class="input-box">
                <input type="password" name="password" id="id_password" placeholder=" " required>
                <label for="id_password">Senha</label>
            </div>

            <!-- Botão de envio do formulário: ao clicar, o sistema valida credenciais e tenta autenticar o usuário -->
            <button type="submit" class="btn-submit">Entrar</button>
        </form>
    </div>

</body>
</html>
